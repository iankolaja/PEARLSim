name: v1_paper_port_lstm
# E5 only: the paper's setup, NOT a generalisation estimate (review #1-#3).
data:
  source: v1_directory
  path: sequence_data
alignment: paper
split:
  mode: paper_random_windows
  seed: 0
  test_families: [gFHR_sequence7]  # the handcrafted sequence the paper held out
  paper_fractions: [0.7, 0.15, 0.15]
targets:
  reactivity: rho
  meshes: {power: 5, flux: 5}
  next_dependents: true
noise:
  train: fixed
  eval_draws: 0
model:
  type: paper_lstm
  params:
    dropout: 0.1
  train:
    learning_rate: 0.01
    batch_size: 1024
    max_epochs: 500
    min_epochs: 10
    patience: 25
